[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=UtilityFunction
Author=nstechbytes & RicardoTM
Information=Demonstrates RainmeterAPI utility functions using the WebView2 plugin.
Version=1.0.0
License=Creative Commons Attribution-Non-Commercial-Share Alike 3.0

[Variables]
DemoVariable=WebView2 Utility

; ========================================
; Measure
; ========================================  
[MeasureWebView]
Measure=Plugin
Plugin=WebView2
URL=file://#@#UtilityFunction\index.html
W=450
H=650
X=0
Y=0

; ========================================
; Background
; ========================================
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,450,650 | FillColor 0,0,0,2 | StrokeWidth 0
